# Render Blueprint: one web service running the FastAPI backend (internal port 8000)
# behind frontend/serve.py, which serves the dashboard on Render's public $PORT
# and forwards /api/* to the backend.
services:
  - type: web
    name: jal-setu
    runtime: python
    plan: free
    # Retrain on every deploy so the model matches the server's library versions.
    buildCommand: pip install -r requirements.txt && python -m src.train
    startCommand: uvicorn app.main:app --host 127.0.0.1 --port 8000 & HOST=0.0.0.0 python frontend/serve.py
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
